<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Analytics | Retail Intelligence</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="dashboard">

    <aside class="sidebar">

        <h2>Retail ETL</h2>

        <ul>

            <li>
                <a href="/">Dashboard</a>
            </li>

            <li class="active">
                <a href="/analytics">Analytics</a>
            </li>

            <li>
                <a href="/products">Products</a>
            </li>

            <li>
                <a href="/customers">Customers</a>
            </li>

            <li>
                <a href="/stores">Stores</a>
            </li>

            <li>
                <a href="/reports">Reports</a>
            </li>

        <li><a class="evaluation-link" href="/evaluation">Performance Evaluation</a></li>
</ul>

    </aside>


    <main class="main">

        <header class="topbar">

            <div>

                <h1>Analytics</h1>

                <p>Business intelligence and sales performance</p>

            </div>

            <div class="status">
                Database Connected
            </div>

        </header>


        <section class="analytics-grid">

            <div class="chart-large">

                {{ category_chart|safe }}

            </div>

            <div class="chart-large">

                {{ store_chart|safe }}

            </div>

        </section>


        <section class="chart-large full-chart">

            {{ daily_chart|safe }}

        </section>

    </main>

</div>


</body>

</html>
